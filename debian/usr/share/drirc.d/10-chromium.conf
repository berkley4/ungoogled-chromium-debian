<!--

Disable 10 bpc color configs to fix VAAPI playback [1] and
broken UI colours in 30-bit colour depth environments.

[1] https://bugs.freedesktop.org/show_bug.cgi?id=106490

-->

<driconf>
    <device>
        <application name="Chromium" executable="chrome">
            <option name="allow_rgb10_configs" value="false" />
        </application>
    </device>
</driconf>
